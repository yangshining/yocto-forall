name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Setup contracts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell and registry contracts
        shell: bash
        run: |
          bash -n configs/setup-env.sh proj_build.sh tests/setup-env-test.sh
          dash -n configs/setup-env.sh
          bash tests/setup-env-test.sh

  validate:
    name: Validate [${{ matrix.baseline }} / ${{ matrix.target }}]
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: scarthgap
            target: zynqmp-generic
            machine: zynqmp-generic
          - baseline: scarthgap
            target: harp-dfe-xczu67dr
            machine: harp-dfe-xczu67dr
          - baseline: kirkstone
            target: ls1043ardb
            machine: ls1043ardb
          - baseline: whinlatter
            target: rk3568-evb
            machine: rockchip-rk3568-evb
          - baseline: scarthgap
            target: stm32mp15-disco
            machine: stm32mp15-disco
          - baseline: whinlatter
            target: raspberrypi4-64
            machine: raspberrypi4-64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 40
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Yocto host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping python3-git python3-jinja2 \
            libegl-mesa0 libsdl2-dev python3-subunit \
            mesa-common-dev zstd liblz4-tool file locales libacl1-dev

      - name: Generate locale
        shell: bash
        run: |
          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Initialize build environment
        env:
          MATRIX_BASELINE: ${{ matrix.baseline }}
          MATRIX_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          . configs/setup-env.sh -T "$MATRIX_TARGET" -p "$MATRIX_BASELINE"

      - name: Verify manifest and machine selection
        env:
          MATRIX_BASELINE: ${{ matrix.baseline }}
          MATRIX_TARGET: ${{ matrix.target }}
          MATRIX_MACHINE: ${{ matrix.machine }}
        shell: bash
        run: |
          build_dir="build/$MATRIX_BASELINE/$MATRIX_TARGET"
          test -f "$build_dir/SOURCE_THIS"
          grep -Fx "TARGET_ID=\"$MATRIX_TARGET\"" "$build_dir/conf/yocto-forall.manifest"
          grep -Fx "BASELINE_ID=\"$MATRIX_BASELINE\"" "$build_dir/conf/yocto-forall.manifest"
          . "$build_dir/SOURCE_THIS"
          actual=$(bitbake-getvar --value MACHINE | tail -n 1)
          if [ "$actual" != "$MATRIX_MACHINE" ]; then
            echo "ERROR: MACHINE is '$actual', expected '$MATRIX_MACHINE'"
            exit 1
          fi

      - name: Show layers
        env:
          MATRIX_BASELINE: ${{ matrix.baseline }}
          MATRIX_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          . "build/$MATRIX_BASELINE/$MATRIX_TARGET/SOURCE_THIS"
          bitbake-layers show-layers

      - name: Parse recipes
        env:
          MATRIX_BASELINE: ${{ matrix.baseline }}
          MATRIX_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          . "build/$MATRIX_BASELINE/$MATRIX_TARGET/SOURCE_THIS"
          bitbake -p
